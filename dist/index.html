<div id="app"></div>
<div id="ui">
<div id="brand"><div class="eyebrow">陶渊明 · 桃花源记</div><h1>桃源<span>豁然开朗</span></h1><div class="english">THE PEACH BLOSSOM SPRING · A LITERARY JOURNEY</div></div>
<div id="weatherBar"><div id="weatherSeg"><button data-weather="morning" class="on">清晨</button><button data-weather="day">晴日</button><button data-weather="evening">暮色</button><button data-weather="rain">春雨</button></div></div>
<div id="scenicInfo" class="panel"><div class="number" id="scenicNumber">03 / 05 · 入境</div><h2 id="scenicName">豁然开朗</h2><p id="scenicQuote">土地平旷，屋舍俨然，有良田、美池、桑竹之属。</p></div>
<nav id="scenicNav" class="panel" aria-label="五境观景"></nav><div id="viewHint">拖动观景　·　滚轮 / 双指缩放　·　1—5 切换五境</div>
<section id="readerPanel" class="panel" aria-label="循文入境阅读控制"></section>

  <div id="loading" role="status" aria-live="polite"><div class="loading-name">桃源</div><div class="loading-sub">一段文字，一处人间。</div><div class="load-track"><span id="loadFill"></span></div><p id="loadLabel">正在营造桃源…</p></div>

  <div id="title">
    <h1>桃源 · 豁然开朗</h1>
    <div class="sub">陶渊明 · 桃花源记</div>
    <div class="rule"></div>
    <div class="desc">晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近……<br>沿溪入桃林，穿山口狭道，豁然见平旷田园。<br>循原文而行，完整经历发现、入村、做客、辞别、寻而不得。</div>
    <button id="enterBtn">循文入境<small>从文章开头 · 完整经历</small></button>
  </div>

  <div id="topbar">
    <div id="actInfo" class="panel" style="display:none"></div>
    <div id="topBtns" style="display:none">
      <button class="tbtn" id="btnToc">目录</button>
      <button class="tbtn" id="btnNotes">注释</button>
      <button class="tbtn" id="btnRead">朗读</button>
      <button class="tbtn" id="btnSound">环境音</button>
      <button class="tbtn" id="btnQuality">画质</button>
      <button class="tbtn" id="btnCalm">减动</button>
      <button class="tbtn" id="btnShot">存图</button>
      <button class="tbtn" id="btnHide">隐藏</button>
    </div>
  </div>

  <div id="caption" class="panel" style="display:none">
    <span id="capText"></span>
    <div id="capNote"></div>
  </div>

  <div id="controls" style="display:none">
    <div id="timeline"><div id="tFill"></div></div>
    <div id="btnRow">
      <button class="tbtn" id="btnPrev">‹ 上一幕</button>
      <button class="tbtn" id="btnPlay">暂停</button>
      <button class="tbtn" id="btnNext">下一幕 ›</button>
      <button class="tbtn" id="btnResetCam">重置镜头</button>
      <button class="tbtn" id="btnRestart">重新开始</button>
      <button class="tbtn" id="btnExit">退出导览</button>
    </div>
    <div id="modeRow">
      <div class="seg" id="modeSeg">
        <button data-m="auto" class="on">连贯体验</button>
        <button data-m="step">逐幕慢读</button>
      </div>
      <div class="seg" id="capSeg">
        <button data-c="both" class="on">原文＋白话</button>
        <button data-c="orig">只看原文</button>
        <button data-c="plain">只看白话</button>
      </div>
    </div>
  </div>

    const trunkH = H*lerp(0.28,0.38,r());
    const nT = 7;
    for(let i=0;i<=nT;i++){
      const t = i/nT;
      const bend = Math.sin(t*Math.PI*.82)*0.18*t;
      trunkPts.push(V3(
        x + lean.x*t*trunkH + Math.cos(yaw)*bend,
        groundY(x,z) + t*trunkH,
        z + lean.z*t*trunkH + Math.sin(yaw)*bend
      ));
    }
    tube(trunkPts, baseR, .026, 8, 14, MAT.bark, 0.9+r()*0.2, 1.0);

    const top = trunkPts[trunkPts.length-1].clone();
    const nMain = 3 + Math.floor(r()*2);
    const mainEnds = [];
    for(let m=0;m<nMain;m++){
      const a = yaw + m/nMain*TAU + (r()-0.5)*0.55;
      const low = m===0 ? .98 : lerp(.68,.92,r());
      const start = new THREE.CatmullRomCurve3(trunkPts,false,'centripetal',.5).getPointAt(low);
      const out = crownW*lerp(0.35,0.52,r())*(0.82+r()*0.36);
      const up = H*lerp(0.30,0.46,r())*(0.8+r()*0.4);
      const p1 = start.clone().add(V3(Math.cos(a+.18)*out*.38, up*.16, Math.sin(a+.18)*out*.38));
      const p2 = start.clone().add(V3(Math.cos(a-.1)*out*.79, up*.53, Math.sin(a-.1)*out*.79));
      const p3 = start.clone().add(V3(Math.cos(a)*out, up, Math.sin(a)*out));
      p1.x += (r()-0.5)*0.22; p1.z += (r()-0.5)*0.22;
      p2.x += (r()-0.5)*0.28; p2.z += (r()-0.5)*0.28;
      p3.x += (r()-0.5)*0.24; p3.z += (r()-0.5)*0.24;
      const pts = [start,p1,p2,p3];
      tube(pts, baseR*lerp(.40,.58,r()), .0045, 7, 12, MAT.bark, 0.86+r()*0.24, 1.35);
      mainEnds.push({pts, a, out, up, start});
    }

    let flowerBudget = Math.round(lerp(400,590,r()) * density);
    let budBudget = Math.round(flowerBudget*0.16);
    let leafBudget = Math.round(flowerBudget*0.10);
    const tipPts = [];
    const tipWeight = [];
    let totalW = 0;

    function subBranch(pts, radius, depth, parentA, parentOut){
      if(pts.length < 2) return;
      const end = pts[pts.length-1];
      const dir = end.clone().sub(pts[0]);
      const len = dir.length() || 0.001;
      dir.divideScalar(len);
      const n = depth === 0 ? 3+Math.floor(r()*2) : 2+Math.floor(r()*2);
      for(let i=0;i<n;i++){
        const t0 = depth === 0 ? lerp(.30,.82,r()) : lerp(.26,.9,r());
        const base = new THREE.CatmullRomCurve3(pts,false,'centripetal',.5).getPointAt(t0);
        const a = parentA + (r()-0.5)*lerp(1.2,1.7,depth) + (i-(n-1)/2)*0.55;
        const out = len*lerp(0.33,0.49,r())*(depth===0?1:0.6);
        const up = len*lerp(.08,.40,r())*(depth===0?1:.7);
        const q1 = base.clone().add(V3(Math.cos(a+.25)*out*.46, up*.26, Math.sin(a+.25)*out*.46));
        const q2 = base.clone().add(V3(Math.cos(a)*out*0.8, up*0.8, Math.sin(a)*out*0.8));
        const q3 = base.clone().add(V3(Math.cos(a)*out, up, Math.sin(a)*out));
        q1.x += (r()-0.5)*0.16; q1.z += (r()-0.5)*0.16;
        q2.x += (r()-0.5)*0.20; q2.z += (r()-0.5)*0.20;
        q3.x += (r()-0.5)*0.18; q3.z += (r()-0.5)*0.18;
        const child = [base,q1,q2,q3];
        const cr = Math.max(radius*lerp(.30,.42,r()), .004);
        tube(child, cr, .0018, depth===0?6:4, depth===0?9:7, MAT.bark, 0.82+r()*0.3, 1.25);
        if(depth === 0){
          tipPts.push(new THREE.CatmullRomCurve3(child,false,'centripetal',.5));tipWeight.push((out*.7+up*.5+.05)*.3);totalW+=tipWeight[tipWeight.length-1];
          subBranch(child, cr, 1, a, out);
        }
        else {
          tipPts.push(new THREE.CatmullRomCurve3(child,false,'centripetal',.5));
          tipWeight.push(out*0.7 + up*0.5 + 0.05);
          totalW += tipWeight[tipWeight.length-1];
        }
      }

    }

    for(const mb of mainEnds){
      subBranch(mb.pts, baseR*0.42, 0, mb.a, mb.out);
      const terminal=new THREE.CatmullRomCurve3(mb.pts,false,'centripetal',.5);terminal.flowerStart=.64;
      tipPts.push(terminal);tipWeight.push(mb.out*.22);totalW+=tipWeight[tipWeight.length-1];
    }
    if(tipPts.length === 0){ tipPts.push(new THREE.CatmullRomCurve3([top,top.clone().add(V3(.15,.5,.1))])); tipWeight.push(1); totalW = 1; }

    function sampleTip(){
      let pick = r()*totalW;
      for(let i=0;i<tipPts.length;i++){
        pick -= tipWeight[i];
        if(pick <= 0){const start=tipPts[i].flowerStart||.12;return tipPts[i].getPointAt(start+r()*(.98-start));}
      }
      return tipPts[tipPts.length-1].getPointAt(.12+r()*.82);
    }

    const center = V3(x, groundY(x,z)+H*0.62, z);
    const tint = new THREE.Color(0xffffff);
    for(let f=0; f<flowerBudget; f++){
      const p = sampleTip();
      p.x += (r()-0.5)*0.045;
      p.y += (r()-0.5)*0.045;
      p.z += (r()-0.5)*0.045;
      const radial = V3(p.x-center.x, 0, p.z-center.z);
      const rl = radial.length() || 0.001;
      radial.divideScalar(rl);
      const outward = V3(radial.x*0.7 + (r()-0.5)*0.5, (r()-0.5)*0.35 + 0.12, radial.z*0.7 + (r()-0.5)*0.5).normalize();
      const d = p.distanceTo(center)/(crownW*0.62);
      const dense = d < 0.55;
      growFlower(p, outward, lerp(0.10,0.15,r())*(dense?0.92:1.04), dense, tint);
      if(r() < 0.10) growBud(p.clone().add(V3((r()-0.5)*0.05,(r()-0.5)*0.04,(r()-0.5)*0.05)), outward, 1);
      if(r() < 0.075) growLeaf(p.clone().add(V3((r()-0.5)*0.06,(r()-0.5)*0.05,(r()-0.5)*0.06)), outward, 1);
    }
    for(let b=0;b<budBudget;b++){
      const p = sampleTip();
      p.x += (r()-0.5)*0.045; p.y += (r()-0.5)*0.045; p.z += (r()-0.5)*0.045;
      growBud(p, V3((r()-0.5)*0.6,0.4+r()*0.4,(r()-0.5)*0.6).normalize(), 0.8+r()*0.5);
    }
    for(let l=0;l<leafBudget;l++){
      const p = sampleTip();
      p.x += (r()-0.5)*0.045; p.y += (r()-0.5)*0.045; p.z += (r()-0.5)*0.045;
      growLeaf(p, V3((r()-0.5)*0.8,0.2+r()*0.5,(r()-0.5)*0.8).normalize(), 0.9+r()*0.5);
    }

    const rootPts = [
      V3(x, groundY(x,z)+0.02, z),
      V3(x + Math.cos(yaw)*baseR*flare, groundY(x,z)+0.015, z + Math.sin(yaw)*baseR*flare),
      V3(x + Math.cos(yaw)*baseR*flare*1.5, groundY(x,z)+0.005, z + Math.sin(yaw)*baseR*flare*1.5)
    ];
    tube(rootPts, baseR*0.42, baseR*0.10, 5, 4, MAT.barkDark, 0.75, 1.0);
    const rootPts2 = [
      V3(x, groundY(x,z)+0.02, z),
      V3(x + Math.cos(yaw+2.4)*baseR*flare, groundY(x,z)+0.015, z + Math.sin(yaw+2.4)*baseR*flare),
      V3(x + Math.cos(yaw+2.4)*baseR*flare*1.4, groundY(x,z)+0.005, z + Math.sin(yaw+2.4)*baseR*flare*1.4)
    ];
    tube(rootPts2, baseR*0.34, baseR*0.08, 5, 4, MAT.barkDark, 0.72, 1.0);
  }

  const trees = [];
  const N = 34 + Math.floor(rng()*9);
  for(let i=0;i<N;i++){
    const z = lerp(8,-5, i/(N-1)) + (rng()-0.5)*0.55;
    const side = i%2===0 ? -1 : 1;
    const off = lerp(3.0,7.0,rng());
    const x = streamX(z) + side*off;
    if(x >= -12) continue;
    if(Math.abs(x - streamX(z)) < 2.4) continue;
    trees.push({x,z,seed:20261002 + i*7919});
  }
  for(let i=trees.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    const t = trees[i]; trees[i]=trees[j]; trees[j]=t;
  }
  const kept = [];
  for(const t of trees){
    let ok = true;
    for(const k of kept){
      const dx=t.x-k.x, dz=t.z-k.z;
      if(dx*dx+dz*dz < 2.1*2.1){ ok=false; break; }
    }
    if(ok) kept.push(t);
    if(kept.length >= N) break;
  }
  const pathZ = [-1.2, 2.4];
  for(const t of kept){
    for(const pz of pathZ){
      if(Math.abs(t.z-pz) < 0.9 && Math.abs(t.x-streamX(pz)) < 4.2){
        t.x += (t.x < streamX(pz) ? -1 : 1)*1.4;
      }
    }
  }

  const camPos = camera.position;
  for(const t of kept){
    const d = Math.hypot(t.x-camPos.x, t.z-camPos.z);
    buildTree(t.x, t.z, t.seed, d);
  }

  const materialGroups=new Map();
  for(let i=0;i<barkGeos.length;i++){const m=barkMats[i];if(!materialGroups.has(m))materialGroups.set(m,[]);materialGroups.get(m).push(barkGeos[i].index?barkGeos[i].toNonIndexed():barkGeos[i]);}
  let branchTriangles=0,draws=0;
  for(const [m,gs] of materialGroups){const geo=mergeGeometries(gs,false);branchTriangles+=geo.attributes.position.count/3;const mesh=new THREE.Mesh(geo,m);mesh.name='peach-connected-branches';mesh.receiveShadow=true;registerShadowCaster(mesh);scene.add(mesh);draws++;gs.forEach(g=>g.dispose());}
  barkGeos.forEach(g=>g.dispose());
  function flush(buckets,cast){
    for(const b of buckets){if(!b.i)continue;
     // 均匀抽样保证轻量模式每棵树仍保留花，切换高画质可恢复全部。
     for(let i=b.i-1;i>0;i--){const j=Math.floor(rng()*(i+1));[b.list[i],b.list[j]]=[b.list[j],b.list[i]];}
     const mesh=new THREE.InstancedMesh(b.geo,b.mat,b.i);mesh.name='peach-bloom-detail';
     for(let i=0;i<b.i;i++){const it=b.list[i];dummy.position.copy(it.p);dummy.quaternion.copy(it.q);dummy.scale.copy(it.s);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);mesh.setColorAt(i,it.c);}
     mesh.instanceMatrix.needsUpdate=true;mesh.instanceColor.needsUpdate=true;mesh.computeBoundingSphere();mesh.receiveShadow=true;
     mesh.userData.peachFullCount=b.i;mesh.count=S.quality==='high'?b.i:Math.floor(b.i*.65);
     if(cast)registerShadowCaster(mesh);scene.add(mesh);draws++;
    }
  }
  flush(petalGeos,true);flush(budGeos,false);flush(leafGeos,true);flush(knotGeos,false);
  PEACH_STATS={treeCount:kept.length,flowerCount,branchTriangles,draws,flowerTriangles:GEOM.flower.attributes.position.count/3};
}

const bambooMat=new THREE.MeshStandardMaterial({color:0x8aa860,roughness:.8});
const bambooMat2=new THREE.MeshStandardMaterial({color:0x7a9a55,roughness:.8});
function makeBamboo(h){
  const g=new THREE.Group();
  const seg=Math.max(3,Math.floor(h/.9));
  for(let i=0;i<seg;i++){
    const c=new THREE.Mesh(new THREE.CylinderGeometry(.05,.055,.9,6), i%2?bambooMat:bambooMat2);
    c.position.y=.45+i*.9; registerShadowCaster(c); g.add(c);
  }
  for(let i=0;i<3;i++){
    const leaf=new THREE.Mesh(new THREE.PlaneGeometry(.5,.12), new THREE.MeshStandardMaterial({color:0x93b06a,side:THREE.DoubleSide,roughness:.8}));
    leaf.position.set((R()-.5)*.4, h*.6+R()*h*.4, (R()-.5)*.4);
    leaf.rotation.set(R()*.8, R()*Math.PI, R()*.8); g.add(leaf);
  }
  return g;
}
function makeMulberry(){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.14,.2,1.8,7),barkMat);
  trunk.position.y=.9; registerShadowCaster(trunk); g.add(trunk);
  for(let i=0;i<4;i++){
    const b=new THREE.Mesh(new THREE.IcosahedronGeometry(.8+R()*.4,1), new THREE.MeshStandardMaterial({color:0x6f9448,roughness:.85,flatShading:true}));
    b.position.set((R()-.5)*1.4, 2+R()*1.2, (R()-.5)*1.4); registerShadowCaster(b); g.add(b);
  }

}
function buildInnerFlora(){
  for(let i=0;i<14;i++){
    const x=14+R()*30, z=-22-R()*8;
    const b=makeBamboo(4+R()*3); b.position.set(x,groundY(x,z),z); b.rotation.y=R()*6; scene.add(b);
  }
  for(let i=0;i<7;i++){
    const x=12+R()*28, z=-20-R()*6;
    const m=makeMulberry(); m.position.set(x,groundY(x,z),z); m.rotation.y=R()*6; scene.add(m);
  }
  const grassGeo=new THREE.BufferGeometry();
  grassGeo.setAttribute('position',new THREE.Float32BufferAttribute([-.04,0,0,.04,0,0,.018,.3,.025, -.04,0,0,.018,.3,.025,-.006,.46,.085, 0,0,-.035,0,0,.035,.08,.37,.005],3));
  grassGeo.computeVertexNormals();
  const grassMat=new THREE.MeshStandardMaterial({color:0x839966,roughness:1,side:THREE.DoubleSide});
  const n=S.quality==='high'?1500:700;
  const inst=new THREE.InstancedMesh(grassGeo,grassMat,n);
  const d=new THREE.Object3D();
  for(let i=0;i<n;i++){
    const x=(R()-.5)*110, z=(R()-.5)*100;
    const dc=Math.abs(x-streamX(z)),pond=Math.hypot(x-9,z+16);
    if((x>4&&x<43&&z>-20&&z<4)||pond<4.25||(z>-5&&z<12&&dc<1.7)||terrainSlope(x,z)>.85||R()>landNoise(x*.19+8,z*.19)){i--;continue;}
    d.position.set(x,groundY(x,z)+.015,z);d.rotation.y=R()*6;d.scale.setScalar(.55+R()*.95);
    d.updateMatrix(); inst.setMatrixAt(i,d.matrix);
  }
  scene.add(inst);
  // 岸边积花（疏密不同）
  const accMat=new THREE.MeshStandardMaterial({color:0xf3c4d2,roughness:.9});
  for(let i=0;i<60;i++){
    const z=8-R()*13.5, side=R()<.5?-1:1;
    const x=streamX(z)+side*(1.8+R()*1.6);
    const p=new THREE.Mesh(petalGeo,accMat);
    p.position.set(x,groundY(x,z)+.02,z);
    p.rotation.set(-Math.PI/2+R()*.3,R()*6,0); p.scale.setScalar(.22+R()*.2);
    scene.add(p);
  }
}

function buildMountainDetails(){
  // Shared, merged, deterministic rock outcrops and strata cracks. No images/models/network.
  if(!scene)return;
  if(buildMountainDetails._done) return; buildMountainDetails._done=true;

  const clamp01=v=>v<0?0:v>1?1:v;
  const smooth01=v=>{const t=clamp01(v);return t*t*(3-2*t);};
  const hash2=(a,b)=>{const n=Math.sin(a*127.1+b*311.7)*43758.5453123;return n-Math.floor(n);};
  const vnoise=(a,b)=>{const xi=Math.floor(a),yi=Math.floor(b),xf=a-xi,yf=b-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    return lerp(lerp(hash2(xi,yi),hash2(xi+1,yi),u),lerp(hash2(xi,yi+1),hash2(xi+1,yi+1),u),v);};
  const fbm=(a,b)=>vnoise(a,b)*0.6+vnoise(a*2.17+3.1,b*2.17+8.7)*0.4;

  // Avoid village, fields, houses, road, cave. Keep rocks on slopes/crests near groundY.
  const forbidden=(x,z)=>{
    if(x>-14&&x<3&&z>-16&&z<1) return true;             // cave passage
    if(x>3&&x<45&&z>-29&&z<4) return true;              // village flat
    if(x>-20&&x<50&&z>-34&&z<8) return true;            // fields/houses margin
    if(x>-18&&x<6&&z>-20&&z<4) return true;             // road/cave approach
    return false;
  };

  const rockMat=new THREE.MeshStandardMaterial({color:0x8b998c,roughness:0.96,metalness:0.0,flatShading:true});
  const crackMat=new THREE.MeshStandardMaterial({color:0x5f6d63,roughness:1.0,metalness:0.0});

  // One low-poly rock geometry (unit), reused by InstancedMesh.
  function makeRockGeo(seed){
    const g=new THREE.IcosahedronGeometry(1,1);
    const pos=g.attributes.position;
    for(let i=0;i<pos.count;i++){
      const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
      const n=fbm(x*1.3+seed*7.1,(y+z)*1.3-seed*3.7);
      const s=1+(n-0.5)*0.55;
      pos.setXYZ(i,x*s,y*(0.72+(n-0.5)*0.35),z*s);
    }
    g.computeVertexNormals();
    return g;
  }
  const rockGeos=[makeRockGeo(1),makeRockGeo(2),makeRockGeo(3)];
  const per=26; // 3 instanced meshes * 26 = 78 rocks
  const dummy=new THREE.Object3D();
  const rockMeshes=[];
  for(let gi=0; gi<rockGeos.length; gi++){
    const im=new THREE.InstancedMesh(rockGeos[gi],rockMat,per);
    im.count=0; im.castShadow=false; im.receiveShadow=true; im.frustumCulled=true;
    rockMeshes.push(im); scene.add(im);
  }

  // Deterministic candidate sampling across terrain, biased to slopes/crests.
  let placed=0, guard=0;
  while(placed<per*rockGeos.length && guard<900){
    guard++;
    const u=hash2(guard*1.7,3.1), v=hash2(guard*2.3,7.7), w=hash2(guard*3.1,11.3);
    // sample mostly back/right mountains and far layers, some foot hills
    const x=-40+u*160 + (w-0.5)*18;
    const z=-95+v*100 + (u-0.5)*24;
    if(Math.abs(x)>118||Math.abs(z)>118) continue;
    if(forbidden(x,z)) continue;
    const gy=groundY(x,z);
    if(gy<2.2) continue; // no rocks on plain
    // slope estimate; prefer moderate slopes, avoid near-vertical cliffs for stable half-buried rocks
    const e=1.2;
    const sx=(groundY(x+e,z)-groundY(x-e,z))/(2*e);
    const sz=(groundY(x,z+e)-groundY(x,z-e))/(2*e);
    const slope=Math.sqrt(sx*sx+sz*sz);
    if(slope<0.18||slope>1.25) continue;
    // vegetation rule: rocks more visible on steeper/rocky flanks; sparse on gentle green slopes
    const rockiness=clamp01((slope-0.25)/0.7)+0.35*clamp01((gy-18)/20);
    if(hash2(guard*5.1,17.9)>rockiness) continue;

    const gi=placed%rockGeos.length;
    const im=rockMeshes[gi];
    const sc=0.7+hash2(guard*7.3,23.1)*2.1; // half-buried scale
    dummy.position.set(x, gy - sc*0.14, z);  // embedded, not floating
    dummy.rotation.set((hash2(guard*9.1,29.7)-0.5)*0.5, hash2(guard*11.3,31.1)*Math.PI*2, (hash2(guard*13.7,37.3)-0.5)*0.5);
    dummy.scale.set(sc*(0.8+0.4*hash2(guard*15.1,41.7)), sc*(0.7+0.35*hash2(guard*17.3,43.9)), sc*(0.8+0.4*hash2(guard*19.7,47.1)));
    dummy.updateMatrix();
    im.setMatrixAt(im.count,dummy.matrix);
    im.count++;
    placed++;
  }
  for(const im of rockMeshes){im.name='mountain-outcrop';im.computeBoundingSphere();im.instanceMatrix.needsUpdate=true; if(typeof registerShadowCaster==='function') registerShadowCaster(im); }

}

function buildMountains(){
 const rock=new THREE.MeshStandardMaterial({color:0x746f62,roughness:1,flatShading:true,side:THREE.DoubleSide});
 const outerRock=new THREE.MeshStandardMaterial({color:0xffffff,vertexColors:true,roughness:1,flatShading:true,side:THREE.DoubleSide});outerRock.userData.wettable=true;
 const {ax,az,bx,bz,floor,width,height}=TUNNEL,dx=bx-ax,dz=bz-az,L=Math.hypot(dx,dz),rx=-dz/L,rz=dx/L;
 const n=18, inner=[[-width,0]],outer=[[-6.2,0]];
 for(let j=0;j<=n;j++){
  const a=Math.PI-j*Math.PI/n;
  inner.push([width*Math.cos(a),.9+(height-.9)*Math.sin(a)]);
  outer.push([6.2*Math.cos(a),1.2+6.3*Math.sin(a)]);
 }
 inner.push([width,0]);outer.push([6.2,0]);
 function point(t,p,isInner=false){
  if(isInner){const across=p[0]*lerp(.15,1,t);return [ax+dx*t+rx*across,floor+p[1]*lerp(.48,1,t),az+dz*t+rz*across];}
  const n=landNoise(t*5.2+p[0]*.25,2.4),across=p[0]*(1.12+.15*Math.sin(t*4.5)+.1*(n-.5));
  const crag=(.84+.25*Math.sin(t*Math.PI)+.28*n+.13*Math.sin(p[0]*1.7+t*3));
  return [ax+dx*t+rx*across,floor+p[1]*crag,az+dz*t+rz*across];
 }
 function rockColor(x,y,z){
  const shade=.75+.32*landNoise(x*.87+y*.3,z*.78-y*.22);

  sets.get(key).geos.push(o.geometry.clone().applyMatrix4(inv.clone().multiply(o.matrixWorld)));remove.push(o);

function makeHouse(w,d,h,withFence){

  };
  const B=(a,b,c)=>new THREE.BoxGeometry(a,b,c);

  const wall2=new THREE.MeshStandardMaterial({color:0xd2c3a4,roughness:.95});
  const wood=new THREE.MeshStandardMaterial({color:0x71644d,roughness:.85});
  const woodD=new THREE.MeshStandardMaterial({color:0x5c5140,roughness:.85});
  const stone=new THREE.MeshStandardMaterial({color:0x8d8a80,roughness:1});

  add(B(w-0.04,h,d-0.04),wall,0,found+h/2,0);

  for(const pz of [-1,1])add(B(w-.08,.10,.12),wood,0,found+h*.60,pz*(d/2-.025));
  for(const px of [-1,1])add(B(.12,.10,d-.08),wood,px*(w/2-.025),found+h*.60,0);

  const roofM=thatched?thatch:tile;
  add(B(rw,0.1,panelLen),roofM,0,found+h+rh/2+0.06,rd/4,slope,0,0);
  add(B(rw,0.1,panelLen),roofM,0,found+h+rh/2+0.06,-rd/4,-slope,0,0);
  add(B(rw+0.18,0.17,0.24),thatched?thatch:tile2,0,found+h+rh+0.02,0);
  add(B(rw+0.1,0.09,0.1),woodD,0,found+h+0.02,rd/2-0.03);
  add(B(rw+0.1,0.09,0.1),woodD,0,found+h+0.02,-(rd/2-0.03));

  if(!thatched){
    const cols=Math.max(9,Math.round(rw/0.42));
    const rows=Math.max(6,Math.round(panelLen/0.4));
    const n=cols*rows*2;
    const im=new THREE.InstancedMesh(B(0.17,0.055,0.05),tile2,n);
    const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),E=new THREE.Euler(),P=new THREE.Vector3(),Sc=new THREE.Vector3(1,1,1);

  add(B(doorW+0.26,0.12,0.14),woodD,0,found+doorH+0.12,fx);
  add(B(doorW,doorH,0.07),woodD,0,found+doorH/2,fx+0.02);
  add(B(doorW*0.62,0.07,0.03),wood,0,found+doorH*0.62,fx+0.07);
  add(B(doorW*0.62,0.07,0.03),wood,0,found+doorH*0.34,fx+0.07);

const petals=[], driftPetals=[];
let petalSys, driftSys;
function buildPetals(){
  const N = 300;
  const inst=new THREE.InstancedMesh(petalGeo, new THREE.MeshStandardMaterial({color:0xf4c2d0,roughness:.7,side:THREE.DoubleSide,transparent:true,opacity:.95}), N);
  inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const d=new THREE.Object3D();
  for(let i=0;i<N;i++){
    const z=8-R()*13.5, side=R()<.5?-1:1;
    const x=streamX(z)+side*(R()*7);
    const p={x, y:groundY(x,z)+2+R()*6, z, vy:.25+R()*.4, ph:R()*6, sw:.3+R()*.5, s:.22+R()*.22};
    petals.push(p);
    d.position.set(p.x,p.y,p.z); d.rotation.set(R()*3,R()*3,R()*3); d.scale.setScalar(p.s);
    d.updateMatrix(); inst.setMatrixAt(i,d.matrix);
  }
  petalSys=inst; scene.add(inst);
  const M=40;
  const dinst=new THREE.InstancedMesh(petalGeo, new THREE.MeshStandardMaterial({color:0xf0b8c8,roughness:.7,side:THREE.DoubleSide,transparent:true,opacity:.9}), M);
  dinst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  for(let i=0;i<M;i++){
    const z=10-R()*16;
    driftPetals.push({x:streamX(z)+(R()-.5)*1.6, z, ph:R()*6, s:.2+R()*.16});
    d.position.set(driftPetals[i].x,-.45,driftPetals[i].z); d.rotation.set(-Math.PI/2,0,R()*6); d.scale.setScalar(driftPetals[i].s);
    d.updateMatrix(); dinst.setMatrixAt(i,d.matrix);
  }
  driftSys=dinst; scene.add(dinst);
}
function updatePetals(t,dt,intensity){
  if(!petalSys) return;
  const d=new THREE.Object3D();
  const wind = Math.sin(t*.4)*.5+.5;
  for(let i=0;i<petalSys.count;i++){
    const p=petals[i];
    p.y -= p.vy*dt*intensity*(S.calm?.4:1);
    p.x += Math.sin(t*1.2+p.ph)*p.sw*dt*(0.6+wind);
    p.z += Math.cos(t*.9+p.ph)*p.sw*.4*dt;
    if(p.y < groundY(p.x,p.z)+.02){ p.y = groundY(p.x,p.z)+2.5+R()*5; }
    d.position.set(p.x,p.y,p.z);
    d.rotation.set(t*.8+p.ph, t*.6+p.ph*2, t*.5+p.ph);
    d.scale.setScalar(p.s);
    d.updateMatrix(); petalSys.setMatrixAt(i,d.matrix);
  }
  petalSys.instanceMatrix.needsUpdate=true;
  for(let i=0;i<driftSys.count;i++){
    const p=driftPetals[i];
    p.z += dt*.5;
    if(p.z>10) p.z=-4.8;
    p.x = streamX(p.z)+(Math.sin(t+p.ph)*.3); // 漂花跟随溪线
    d.position.set(p.x,-.45,p.z);
    d.rotation.set(-Math.PI/2,0,t+p.ph);
    d.scale.setScalar(p.s);
    d.updateMatrix(); driftSys.setMatrixAt(i,d.matrix);
  }
  driftSys.instanceMatrix.needsUpdate=true;
}

let audioCtx=null, ambientGain=null, ambientSuspendedForVisibility=false, pageHiddenAt=0;
function handlePageVisibility(){
  if(clock)clock.getDelta();
  invalidateRender();
  if(document.hidden){
    pageHiddenAt=performance.now();
    // Cancel native speech reliably; the same sentence restarts when the tour becomes visible.
    if(S.touring&&S.playing&&S.reading)stopSpeak();
    if(audioCtx&&audioCtx.state==='running'){
      ambientSuspendedForVisibility=true;
      audioCtx.suspend().catch(()=>{});
    }
  }else{
    if(pageHiddenAt&&S.manual&&Number.isFinite(S.manualUntil))S.manualUntil+=performance.now()-pageHiddenAt;
    pageHiddenAt=0;
    if(ambientSuspendedForVisibility&&audioCtx&&S.sound)audioCtx.resume().catch(()=>{});
    ambientSuspendedForVisibility=false;
  }
}
function initAudio(){
  if(audioCtx) return;
  try{
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    ambientGain = audioCtx.createGain(); ambientGain.gain.value=0;
    ambientGain.connect(audioCtx.destination);
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*2, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;
    const noise = audioCtx.createBufferSource(); noise.buffer=buf; noise.loop=true;
    const filter = audioCtx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=1200; filter.Q.value=.6;
    const g1 = audioCtx.createGain(); g1.gain.value=.12;ambientFilter=filter;ambientNoiseGain=g1;
    noise.connect(filter); filter.connect(g1); g1.connect(ambientGain); noise.start();
    const osc = audioCtx.createOscillator(); osc.type='sine'; osc.frequency.value=180;
    const g2 = audioCtx.createGain(); g2.gain.value=.03;
    osc.connect(g2); g2.connect(ambientGain); osc.start();ambientToneGain=g2;applyAmbientWeather();
  }catch(e){ audioCtx=null; }
}
function setAmbient(on){
  if(!audioCtx) initAudio();
  if(!audioCtx) return;
  ambientGain.gain.linearRampToValueAtTime(on?1:0, audioCtx.currentTime+.5);
  if(document.hidden){
    ambientSuspendedForVisibility=on;
    if(audioCtx.state==='running')audioCtx.suspend().catch(()=>{});
    return;
  }
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
}

  if(S.reading){
   speakCurrent();
   if(speechActive&&!speechStarted&&performance.now()-speechWaitSince>5500){
    speechEvents.push({type:'unavailable',sent:S.sent,reason:'native-voice-did-not-start'});stopSpeak();S.reading=false;$('btnRead').classList.remove('on');toast('设备朗读未能启动，继续无声游历');
   }
  }
  const duration=Math.max(3.5+SENT[S.sent].t.length*.16,({1:12,2:12,5:12,6:12,17:9,18:12,19:28,21:18})[S.sent]||0);
  S.actT=Math.min(1,S.actT+dt/duration);
  if(S.actT>=1&&(!S.reading||speechCompleted)){
   if(S.sent<a.e){gotoSent(S.sent+1,true);}
   else if(S.mode==='step'||S.act===ACTS.length-1){S.playing=false;S.atActEnd=true;updatePlayBtn();}
   else gotoSent(ACTS[S.act+1].s,true);
  }
  updateCharacters(dt,S.environmentTime);
  if(!S.manual){const shot=currentShot();CAM.pos.lerp(shot.pos,Math.min(1,dt*2.8));CAM.look.lerp(shot.look,Math.min(1,dt*2.8));}
 }
 updateCam(dt);
 if(worldAnimating){
  S.environmentTime+=dt;const t=S.environmentTime;updatePetals(t,dt,ENV.petalIntensity);if(weatherName==='rain')updateRainWeather(t);
  for(const v of P.villagers){const u=v.userData;
   if(u.pose==='hoe')u.armR.rotation.x=Math.sin(t*1.5+u.phase)*.5;
   else if(u.pose==='winnow')u.armL.rotation.z=.6+Math.sin(t*2.2+u.phase)*.3;
   else if(u.pose==='play')v.rotation.y+=dt*.4;
   else if(u.pose==='sit')u.head.rotation.y=Math.sin(t*.4+u.phase)*.3;
  }
  if(P.dog)P.dog.userData.tail.rotation.z=.5+Math.sin(t*6)*.4;
  if(P.chicken)P.chicken.rotation.y+=dt*.8;
 }
 $('tFill').style.width=((S.sent+S.actT)/SENT.length*100)+'%';$('timeline').setAttribute('aria-valuenow',String(S.sent));
 renderSceneIfNeeded(tourAdvancing||worldAnimating);
}
/* ============================================================
   17. 诊断接口（只读，不暴露凭证）
============================================================ */
const taoyuanDiagnostics = {
  getState(){
    let shadowCasterCount=0,shadowEligibleCount=0;scene.traverse(o=>{if(o.userData.taoyuanShadowCaster){shadowEligibleCount++;if(o.castShadow)shadowCasterCount++;}});
    return {
      ready:true,weather:weatherName,rainActive:!!rainSys?.visible,rainCount:rainSys?.visible?rainSys.geometry.drawRange.count/2:0,rippleCount:rippleSys?.visible?rippleSys.count:0,rainUpdates,rainSample:rainSys?Array.from(rainSys.geometry.attributes.position.array.slice(0,6)):[],groundColor:terrainMaterial?.color.getHex(),groundRoughness:terrainMaterial?.roughness,peachStats:{...PEACH_STATS},act:S.act, sent:S.sent, actName:ACTS[S.act].name,
      touring:S.touring,playing:S.playing, mode:S.mode, cap:S.cap,
      sentenceProgress:S.actT,atActEnd:S.atActEnd,speechActive,speechCompleted,spokenSentenceId,speechEvents:[...speechEvents],environmentTime:S.environmentTime,
      pixelRatio:renderer.getPixelRatio(),shadows:renderer.shadowMap.enabled,petalCount:petalSys.count,
      visibleCrowd:P.crowd.filter(v=>v.visible).length,visibleInvitees:P.invitees.filter(v=>v.visible).length,
      visibleSearchers:P.searchers.filter(v=>v.visible).length,feastVisible:feastTable.visible,liuZijiVisible:P.liuZiji.visible,
      reading:S.reading, sound:S.sound, calm:S.calm, quality:S.quality,
      cameraPos:{x:camera.position.x,y:camera.position.y,z:camera.position.z},
      fisherPos:{x:P.fisher.position.x,y:P.fisher.position.y,z:P.fisher.position.z},
      boatPos:{x:P.boat.position.x,y:P.boat.position.y,z:P.boat.position.z},
      visibleVillagers:P.villagers.filter(v=>v.visible).length,
      visibleMarks:P.marks.filter(m=>m.visible).length,
      renderedFrames,skippedFrames,pageHidden:document.hidden,shadowCasterCount,shadowEligibleCount,reflectionSize:poolReflection.getRenderTarget().width,
      renderCalls:renderer.info.render.calls,
      triangles:renderer.info.render.triangles,
    };
  }
};

/* ============================================================
   18. 启动
============================================================ */
async function init(){
  try{
    initThree();
  }catch(e){
    document.getElementById('loading').innerHTML='<p style="color:#a34a35">WebGL 不可用，请更换支持 WebGL 的浏览器。</p>';
    return;
  }
  const stages=[
   ['铺开山水',()=>{initLights();buildTerrain();buildWater();buildRoads();buildMountains();buildMountainDetails();}],
   ['桃林初绽',()=>{buildPeachForest();buildInnerFlora();}],
   ['田畴与人家',()=>{buildVillage();buildScenery();}],
   ['人间烟火',()=>{buildCharacters();buildPetals();buildMarks();buildGate();buildRainWeather();}],
  ];
  for(let i=0;i<stages.length;i++){
   $('loadLabel').textContent=stages[i][0]+' · '+(i+1)+' / '+stages.length;$('loadFill').style.width=(12+i*21)+'%';
   await new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,0)));
   stages[i][1]();
  }
  initVoice();
  bindUI();
  initEditorialUI();
  buildTOC();
  buildNotes();
  updateCaption();
  setQuality(S.quality);
  S.act=2;S.sent=7;applySentState(2,7);setCam(DEFAULT_VIEW.pos,DEFAULT_VIEW.look);syncUI();
  $('btnCalm').classList.toggle('on',S.calm);
  window.__taoyuan=taoyuanDiagnostics;
  $('loadFill').style.width='100%';$('loadLabel').textContent='桃源已至';
  setTimeout(()=>{ $('loading').classList.add('hide');setTimeout(()=>{$('loading').style.display='none';},550); },120);
  animate();
}
init().catch(e=>{console.error(e);document.getElementById('loading').innerHTML='<p>场景未能完成载入，请刷新页面重试。</p>';document.getElementById('loading').classList.remove('hide');});
</script>
