const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

/* ============================================================
   3. 世界布局：溪流 / 路径 / 地面函数（统一坐标）
   溪流自西北(-46,9)流向东南(-12,-5)，桃林夹岸，
   山口位于(-10,-6)，隧道轴线通向村口(2,-9)，村落在(10..34, -4..-18)。
============================================================ */
const STREAM = { x0:-46, z0:9, x1:-12, z1:-5 };
function streamX(z){ const t=clamp((z-STREAM.z0)/(STREAM.z1-STREAM.z0),0,1); return lerp(STREAM.x0,STREAM.x1,t); }
function streamDir(){ return V3(STREAM.x1-STREAM.x0,0,STREAM.z1-STREAM.z0).normalize(); }

const PATH = [
 {p:V3(-44,0,7.5),label:'溪口'},
 {p:V3(-38,0,5.5)},{p:V3(-32,0,3.5)},{p:V3(-26,0,1.5)},{p:V3(-20,0,-.5)},{p:V3(-15,0,-3)},
 {p:V3(-11.5,0,-4.8),label:'桃林尽头'},
 {p:V3(-10,0,-6),label:'山小口'},
 {p:V3(-8,0,-6.6),label:'狭道'},
 {p:V3(-6,0,-7.2),label:'狭道'},
 {p:V3(-4,0,-8),label:'洞口'},
 {p:V3(-1,0,-8.6),label:'豁然开朗'},
 {p:V3(3,0,-9.2)},{p:V3(7,0,-9.6),label:'村口'},
 {p:V3(11,0,-10)},{p:V3(15,0,-11),label:'村中'},
 {p:V3(19,0,-12)},{p:V3(23,0,-13),label:'村东'},
 {p:V3(27,0,-14)},{p:V3(31,0,-15),label:'村东头'},
];
function pathPoint(t){
  const n=PATH.length-1, f=clamp(t,0,1)*n, i=Math.min(Math.floor(f),n-1), u=f-i;
  return PATH[i].p.clone().lerp(PATH[i+1].p, smooth(u));
}

// 每句对应同一条连续路径；回程按相反方向穿洞，再回外溪。
const SENT_SPAN=[[0,.5],[.5,2],[2,4],[4,5.5],[5.5,6],[6,9.2],[9.2,12],[12,14],[14,15],[15,16],[16,16],[16,16],[16,16],[16,16],[16,16],[16,16],[16,16],[16,17.5],[17.5,13],[13,0],[0,0],[0,3],[0,0],[0,0]];
for(let i=0;i<=6;i++) PATH[i].p.x=streamX(PATH[i].p.z);
PATH[6].p.set(-12,0,-5);
const TUNNEL={ax:-10,az:-6,bx:-1,bz:-8.8,floor:-.35,width:3.2,height:4.8};
const DEFAULT_VIEW={pos:V3(-.8,4.65,-8.5),look:V3(24,2,-12.7)};
function pathIndexAtSent(i,k=S.actT){const a=SENT_SPAN[i];return lerp(a[0],a[1],clamp(k,0,1));}
function pathTFromSent(a,i){return pathIndexAtSent(i)/(PATH.length-1);}
function pathPointAtSent(i,k=S.actT){return pathPoint(pathIndexAtSent(i,k)/(PATH.length-1));}
function tunnelCoordinates(x,z){
 const dx=TUNNEL.bx-TUNNEL.ax,dz=TUNNEL.bz-TUNNEL.az,L=Math.hypot(dx,dz);
 return {t:((x-TUNNEL.ax)*dx+(z-TUNNEL.az)*dz)/(L*L),d:Math.abs((x-TUNNEL.ax)*(-dz/L)+(z-TUNNEL.az)*(dx/L))};
}
function terrainH(x,z){
 let h=Math.sin(x*.045)*Math.cos(z*.05)*.5+Math.sin(x*.11+z*.07)*.22;
 const village=clamp((Math.hypot(x-21,z+10)-28)/10,0,1); h*=village;
 const dc=Math.abs(x-streamX(z));
 if(z>-5.4&&z<13)h=lerp(-.8,h,clamp((dc-1.3)/1.8,0,1));
 const dp=Math.hypot(x-9,z+16);if(dp<5.5)h=lerp(-.65,h,clamp((dp-4.2)/1.3,0,1));
 const q=tunnelCoordinates(x,z);if(q.t>=0&&q.t<=1&&q.d<1.45)h=TUNNEL.floor;
 return h;
}
// Ling 生成的多尺度山脊经过峰高、山脚和地貌层次整合；噪声保持空间连续。
const landHash=(a,b)=>{const n=Math.sin(a*127.1+b*311.7)*43758.5453123;return n-Math.floor(n);};
function landNoise(a,b){const xi=Math.floor(a),yi=Math.floor(b),xf=a-xi,yf=b-yi,u=smooth(xf),v=smooth(yf);return lerp(lerp(landHash(xi,yi),landHash(xi+1,yi),u),lerp(landHash(xi,yi+1),landHash(xi+1,yi+1),u),v);}
const landFbm=(a,b)=>landNoise(a,b)*.55+landNoise(a*2.13+5.2,b*2.13+1.3)*.28+landNoise(a*4.31+9.7,b*4.31+7.9)*.17;
const landRidge=(a,b)=>{const n=landFbm(a,b),r=1-Math.abs(2*n-1);return r*r;};
function mountainH(x,z){
 const clamp01=v=>clamp(v,0,1),smooth01=v=>smooth(clamp01(v));
  // Keep passage and village flat.
  if(x>-14&&x<3&&z>-16&&z<1) return 0;
  if(x>3&&x<45&&z>-29&&z<4) return 0;

  // Village apron: no mountain, gentle foot transition outward.
  const dvx=(x-24)/30, dvz=(z+12.5)/24;
  const dv=Math.sqrt(dvx*dvx+dvz*dvz);
  const villageMask=smooth01((dv-0.95)/0.45); // 0 inside, 1 outside

  // Major peaks: main background (72,-42) 38-46, side (83,28) ~30, far layers 40-55.
  const peaks=[
    [96,-51,28,24,46,1.00],
    [110,31,31,25,38,.90],
    [41,-99,32,23,43,.94],
    [111,-111,33,26,55,.97],
    [68,-77,29,19,35,.90],
    [122,-30,31,23,41,.84],
    [-22,-75,32,22,30,.84],
    [-70,-46,28,24,30,.82],
    [-55,74,34,25,31,.84],
    [9,105,35,27,37,.90],
    [65,93,31,22,37,.90],
    [-24,-136,37,27,45,.88],
    [62,-143,34,23,51,.93]
  ];
  let h=0, crest=0;
  for(let i=0;i<peaks.length;i++){
    const p=peaks[i];
    // rotate local frame per peak for asymmetry (deterministic angle)
    const ang=(i*0.73+0.4);
    const ca=Math.cos(ang), sa=Math.sin(ang);
    const dx=x-p[0], dz=z-p[1];
    const lx=dx*ca-dz*sa, lz=dx*sa+dz*ca;
    const ex=lx/(p[2]*(1+0.25*Math.sin(i*2.1))), ez=lz/(p[3]*(1+0.22*Math.cos(i*1.7)));
    const q=ex*ex+ez*ez;
    if(q>9) continue;
    const fall=Math.exp(-q*0.72);
    // ridged detail only near crest, stronger on one flank (erosion asymmetry)
    const r=landRidge(x*0.018+i*3.1, z*0.018-i*2.7);
    const flank=(lx>0?1:0.55);
    const ribs=landRidge(lx*.095+i*7.4,lz*.045-i*3.8);
    const local=p[4]*(.58+.19*r*flank+.23*ribs)*fall;
    h=Math.max(h,p[5]*local);
    crest=Math.max(crest,fall);
  }

  // 峰群以山鞍相连，不能相加成横挡在村前的高墙。
  // Erosion grooves: directional channels on flanks, not on foot.
  const groove=Math.pow(Math.abs(Math.sin(x*0.055+z*0.021+Math.sin(z*0.043)*2.0)),6);
  const grooveMask=smooth01((crest-0.12)/0.25)*smooth01((h-6)/10);
  h*=1-0.16*groove*grooveMask;

  // Foot hills and valley apron so mountain foot transitions to village plain.
  const foot=landFbm(x*0.035+11.3,z*0.035-7.7);
  const footH=(2.2+5.5*foot)*smooth01((dv-0.8)/0.9);
  const dxFlat=Math.max(3-x,x-45,0),dzFlat=Math.max(-29-z,z-4,0);
  const apron=smooth01(Math.hypot(dxFlat,dzFlat)/20);
  h=(h+footH*.35)*villageMask*apron;

  // Fade to zero beyond world bounds and near extreme edges.
  const edge=Math.max(Math.abs(x),Math.abs(z));
  h*=smooth01((160-edge)/22);

  const streamValley=smooth01((Math.abs(x-streamX(clamp(z,-5,13)))-6)/9);
  const outsideStream=z>-10&&z<18&&x<-10?streamValley:1;
  return Math.max(0,h)*outsideStream;
}
function caveMassH(x,z){
 const q=tunnelCoordinates(x,z),along=clamp(1-((q.t-.45)/.94)**2,0,1);
 if(q.d<3.25)return 0;
 return 9.8*along*along*smooth(clamp((q.d-3.25)/2.7,0,1))*Math.max(0,1-(q.d/17)**2)**2*(.88+.2*landNoise(x*.24,z*.24));
}
function groundY(x,z){return terrainH(x,z)+mountainH(x,z)+caveMassH(x,z);}
function terrainSlope(x,z){const e=.65;return Math.hypot(groundY(x+e,z)-groundY(x-e,z),groundY(x,z+e)-groundY(x,z-e))/(2*e);}

function buildTerrain(){

  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i);
    pos.setY(i, groundY(x,z));
  }
  geo.computeVertexNormals();
  const cols=[]; const cGrass=new THREE.Color(0x90a485), cMeadow=new THREE.Color(0xa8b395), cDry=new THREE.Color(0x7e927b), cRock=new THREE.Color(0x999d94);
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i), y=pos.getY(i);
    let c = cGrass.clone().lerp(cMeadow, clamp((Math.sin(x*.08)+Math.cos(z*.07))*.5+.5,0,1)*.6);
    const slope=Math.hypot(geo.attributes.normal.getX(i),geo.attributes.normal.getZ(i))/Math.max(.12,geo.attributes.normal.getY(i));

    c.multiplyScalar(grain*seam);
    const dp=Math.hypot(x-9,z+16); if(dp<5.5) c.lerp(new THREE.Color(0x6f8a4e),.4);
    cols.push(c.r,c.g,c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols,3));
  const mat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:.95, metalness:0});
  mat.userData.wettable=true;terrainMaterial=mat;const mesh = new THREE.Mesh(geo,mat);mesh.name='terrain-ground';

}

function buildPeachForest(){

    const key = geo.uuid+'|'+mat.uuid;

   for(let i=0;i<pos.count;i++){const d=Math.abs(pos.getZ(i))/.112;pos.setY(i,.017*d*d);const c=new THREE.Color(0xf3b7cc).lerp(new THREE.Color(0xc96d91),Math.max(0,1-d)*.45);col.push(c.r,c.g,c.b);}
   g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.rotateY(k*TAU/5);g.computeVertexNormals();flowerParts.push(g.index?g.toNonIndexed():g);

      for(let i=0;i<n;i++){
        const t0 = depth === 0 ? lerp(.30,.82,r()) : lerp(.26,.9,r());
        const base = new THREE.CatmullRomCurve3(pts,false,'centripetal',.5).getPointAt(t0);
        const a = parentA + (r()-0.5)*lerp(1.2,1.7,depth) + (i-(n-1)/2)*0.55;

        const q1 = base.clone().add(V3(Math.cos(a+.25)*out*.46, up*.26, Math.sin(a+.25)*out*.46));

        const q3 = base.clone().add(V3(Math.cos(a)*out, up, Math.sin(a)*out));
        q1.x += (r()-0.5)*0.16; q1.z += (r()-0.5)*0.16;
        q2.x += (r()-0.5)*0.20; q2.z += (r()-0.5)*0.20;
        q3.x += (r()-0.5)*0.18; q3.z += (r()-0.5)*0.18;
        const child = [base,q1,q2,q3];
        const cr = Math.max(radius*lerp(.30,.42,r()), .004);
        tube(child, cr, .0018, depth===0?6:4, depth===0?9:7, MAT.bark, 0.82+r()*0.3, 1.25);

    const tint = new THREE.Color(0xffffff);

      const p = sampleTip();

      p.y += (r()-0.5)*0.045;
      p.z += (r()-0.5)*0.045;
      const radial = V3(p.x-center.x, 0, p.z-center.z);
      const rl = radial.length() || 0.001;
      radial.divideScalar(rl);
      const outward = V3(radial.x*0.7 + (r()-0.5)*0.5, (r()-0.5)*0.35 + 0.12, radial.z*0.7 + (r()-0.5)*0.5).normalize();

    const rootPts2 = [
      V3(x, groundY(x,z)+0.02, z),
      V3(x + Math.cos(yaw+2.4)*baseR*flare, groundY(x,z)+0.015, z + Math.sin(yaw+2.4)*baseR*flare),
      V3(x + Math.cos(yaw+2.4)*baseR*flare*1.4, groundY(x,z)+0.005, z + Math.sin(yaw+2.4)*baseR*flare*1.4)
    ];

  }

  const trees = [];
  const N = 34 + Math.floor(rng()*9);
  for(let i=0;i<N;i++){

  }

    const j = Math.floor(rng()*(i+1));

  for(const t of trees){

      const dx=t.x-k.x, dz=t.z-k.z;

  function flush(buckets,cast){

     for(let i=b.i-1;i>0;i--){const j=Math.floor(rng()*(i+1));[b.list[i],b.list[j]]=[b.list[j],b.list[i]];}

     mesh.userData.peachFullCount=b.i;mesh.count=S.quality==='high'?b.i:Math.floor(b.i*.65);

    }
  }
  flush(petalGeos,true);flush(budGeos,false);flush(leafGeos,true);flush(knotGeos,false);

}

function buildMountainDetails(){
  // Shared, merged, deterministic rock outcrops and strata cracks. No images/models/network.
  if(!scene)return;
  if(buildMountainDetails._done) return; buildMountainDetails._done=true;

  const clamp01=v=>v<0?0:v>1?1:v;
  const smooth01=v=>{const t=clamp01(v);return t*t*(3-2*t);};
  const hash2=(a,b)=>{const n=Math.sin(a*127.1+b*311.7)*43758.5453123;return n-Math.floor(n);};
  const vnoise=(a,b)=>{const xi=Math.floor(a),yi=Math.floor(b),xf=a-xi,yf=b-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    return lerp(lerp(hash2(xi,yi),hash2(xi+1,yi),u),lerp(hash2(xi,yi+1),hash2(xi+1,yi+1),u),v);};
  const fbm=(a,b)=>vnoise(a,b)*0.6+vnoise(a*2.17+3.1,b*2.17+8.7)*0.4;

  // Avoid village, fields, houses, road, cave. Keep rocks on slopes/crests near groundY.
  const forbidden=(x,z)=>{
    if(x>-14&&x<3&&z>-16&&z<1) return true;             // cave passage
    if(x>3&&x<45&&z>-29&&z<4) return true;              // village flat
    if(x>-20&&x<50&&z>-34&&z<8) return true;            // fields/houses margin
    if(x>-18&&x<6&&z>-20&&z<4) return true;             // road/cave approach
    return false;
  };

  const rockMat=new THREE.MeshStandardMaterial({color:0x8b998c,roughness:0.96,metalness:0.0,flatShading:true});
  const crackMat=new THREE.MeshStandardMaterial({color:0x5f6d63,roughness:1.0,metalness:0.0});

  // One low-poly rock geometry (unit), reused by InstancedMesh.
  function makeRockGeo(seed){
    const g=new THREE.IcosahedronGeometry(1,1);
    const pos=g.attributes.position;
    for(let i=0;i<pos.count;i++){
      const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
      const n=fbm(x*1.3+seed*7.1,(y+z)*1.3-seed*3.7);
      const s=1+(n-0.5)*0.55;
      pos.setXYZ(i,x*s,y*(0.72+(n-0.5)*0.35),z*s);
    }
    g.computeVertexNormals();
    return g;
  }
  const rockGeos=[makeRockGeo(1),makeRockGeo(2),makeRockGeo(3)];
  const per=26; // 3 instanced meshes * 26 = 78 rocks
  const dummy=new THREE.Object3D();
  const rockMeshes=[];
  for(let gi=0; gi<rockGeos.length; gi++){
    const im=new THREE.InstancedMesh(rockGeos[gi],rockMat,per);
    im.count=0; im.castShadow=false; im.receiveShadow=true; im.frustumCulled=true;
    rockMeshes.push(im); scene.add(im);
  }

  // Deterministic candidate sampling across terrain, biased to slopes/crests.
  let placed=0, guard=0;
  while(placed<per*rockGeos.length && guard<900){
    guard++;
    const u=hash2(guard*1.7,3.1), v=hash2(guard*2.3,7.7), w=hash2(guard*3.1,11.3);
    // sample mostly back/right mountains and far layers, some foot hills
    const x=-40+u*160 + (w-0.5)*18;
    const z=-95+v*100 + (u-0.5)*24;
    if(Math.abs(x)>118||Math.abs(z)>118) continue;
    if(forbidden(x,z)) continue;
    const gy=groundY(x,z);
    if(gy<2.2) continue; // no rocks on plain
    // slope estimate; prefer moderate slopes, avoid near-vertical cliffs for stable half-buried rocks
    const e=1.2;
    const sx=(groundY(x+e,z)-groundY(x-e,z))/(2*e);
    const sz=(groundY(x,z+e)-groundY(x,z-e))/(2*e);
    const slope=Math.sqrt(sx*sx+sz*sz);
    if(slope<0.18||slope>1.25) continue;
    // vegetation rule: rocks more visible on steeper/rocky flanks; sparse on gentle green slopes
    const rockiness=clamp01((slope-0.25)/0.7)+0.35*clamp01((gy-18)/20);
    if(hash2(guard*5.1,17.9)>rockiness) continue;

    const gi=placed%rockGeos.length;
    const im=rockMeshes[gi];
    const sc=0.7+hash2(guard*7.3,23.1)*2.1; // half-buried scale
    dummy.position.set(x, gy - sc*0.14, z);  // embedded, not floating
    dummy.rotation.set((hash2(guard*9.1,29.7)-0.5)*0.5, hash2(guard*11.3,31.1)*Math.PI*2, (hash2(guard*13.7,37.3)-0.5)*0.5);
    dummy.scale.set(sc*(0.8+0.4*hash2(guard*15.1,41.7)), sc*(0.7+0.35*hash2(guard*17.3,43.9)), sc*(0.8+0.4*hash2(guard*19.7,47.1)));
    dummy.updateMatrix();
    im.setMatrixAt(im.count,dummy.matrix);
    im.count++;
    placed++;
  }
  for(const im of rockMeshes){im.name='mountain-outcrop';im.computeBoundingSphere();im.instanceMatrix.needsUpdate=true; if(typeof registerShadowCaster==='function') registerShadowCaster(im); }

}

  const c=[];for(let i=0;i<v.length;i+=3)c.push(...rockColor(v[i],v[i+1],v[i+2]));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));
  const m=new THREE.Mesh(g,outerRock);m.name='open-rock-portal';m.receiveShadow=true;registerShadowCaster(m);scene.add(m);

const houses=[];
function batchGroupGeometry(group){
 group.updateMatrixWorld(true);const sets=new Map(),remove=[];const inv=group.matrixWorld.clone().invert();
 group.traverse(o=>{if(!o.isMesh||o.isInstancedMesh||Array.isArray(o.material))return;
  const key=o.material.uuid;if(!sets.has(key))sets.set(key,{mat:o.material,geos:[]});
  sets.get(key).geos.push(o.geometry.clone().applyMatrix4(inv.clone().multiply(o.matrixWorld)));remove.push(o);
 });
 remove.forEach(o=>o.parent.remove(o));for(const {mat,geos} of sets.values()){
  const geo=mergeGeometries(geos,false);if(!geo)throw Error('屋舍几何合并失败');const mesh=new THREE.Mesh(geo,mat);registerShadowCaster(mesh);mesh.receiveShadow=true;group.add(mesh);geos.forEach(g=>g.dispose());

const petals=[], driftPetals=[];
let petalSys, driftSys;
function buildPetals(){
  const N = 300;
  const inst=new THREE.InstancedMesh(petalGeo, new THREE.MeshStandardMaterial({color:0xf4c2d0,roughness:.7,side:THREE.DoubleSide,transparent:true,opacity:.95}), N);
  inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const d=new THREE.Object3D();
  for(let i=0;i<N;i++){
    const z=8-R()*13.5, side=R()<.5?-1:1;
    const x=streamX(z)+side*(R()*7);
    const p={x, y:groundY(x,z)+2+R()*6, z, vy:.25+R()*.4, ph:R()*6, sw:.3+R()*.5, s:.22+R()*.22};
    petals.push(p);
    d.position.set(p.x,p.y,p.z); d.rotation.set(R()*3,R()*3,R()*3); d.scale.setScalar(p.s);
    d.updateMatrix(); inst.setMatrixAt(i,d.matrix);
  }
  petalSys=inst; scene.add(inst);
  const M=40;
  const dinst=new THREE.InstancedMesh(petalGeo, new THREE.MeshStandardMaterial({color:0xf0b8c8,roughness:.7,side:THREE.DoubleSide,transparent:true,opacity:.9}), M);
  dinst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  for(let i=0;i<M;i++){
    const z=10-R()*16;
    driftPetals.push({x:streamX(z)+(R()-.5)*1.6, z, ph:R()*6, s:.2+R()*.16});
    d.position.set(driftPetals[i].x,-.45,driftPetals[i].z); d.rotation.set(-Math.PI/2,0,R()*6); d.scale.setScalar(driftPetals[i].s);
    d.updateMatrix(); dinst.setMatrixAt(i,d.matrix);
  }
  driftSys=dinst; scene.add(dinst);
}
function updatePetals(t,dt,intensity){
  if(!petalSys) return;
  const d=new THREE.Object3D();
  const wind = Math.sin(t*.4)*.5+.5;
  for(let i=0;i<petalSys.count;i++){
    const p=petals[i];
    p.y -= p.vy*dt*intensity*(S.calm?.4:1);
    p.x += Math.sin(t*1.2+p.ph)*p.sw*dt*(0.6+wind);
    p.z += Math.cos(t*.9+p.ph)*p.sw*.4*dt;
    if(p.y < groundY(p.x,p.z)+.02){ p.y = groundY(p.x,p.z)+2.5+R()*5; }
    d.position.set(p.x,p.y,p.z);
    d.rotation.set(t*.8+p.ph, t*.6+p.ph*2, t*.5+p.ph);
    d.scale.setScalar(p.s);
    d.updateMatrix(); petalSys.setMatrixAt(i,d.matrix);
  }
  petalSys.instanceMatrix.needsUpdate=true;
  for(let i=0;i<driftSys.count;i++){
    const p=driftPetals[i];
    p.z += dt*.5;
    if(p.z>10) p.z=-4.8;
    p.x = streamX(p.z)+(Math.sin(t+p.ph)*.3); // 漂花跟随溪线
    d.position.set(p.x,-.45,p.z);
    d.rotation.set(-Math.PI/2,0,t+p.ph);
    d.scale.setScalar(p.s);
    d.updateMatrix(); driftSys.setMatrixAt(i,d.matrix);
  }
  driftSys.instanceMatrix.needsUpdate=true;
}

  const treeSpots=[];

  const trunks=[];

      const ll=lerp(1.5,0.8,t)*(0.85+R()*0.35);

      }

  trunkIM.instanceMatrix.needsUpdate=true; trunkIM.receiveShadow=true; registerShadowCaster(trunkIM); scene.add(trunkIM);

  branchIM.count=bi; branchIM.instanceMatrix.needsUpdate=true; branchIM.receiveShadow=true; registerShadowCaster(branchIM); scene.add(branchIM);
  perMat.forEach((arr,mi)=>{

    im.instanceMatrix.needsUpdate=true; im.receiveShadow=true; registerShadowCaster(im); scene.add(im);
  });

 const pick=()=>{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;};

function speakCurrent(){

 const id=++speechId,sent=S.sent;spokenSentenceId=sent;speechActive=true;speechCompleted=false;speechStarted=false;speechWaitSince=performance.now();
 const u=new SpeechSynthesisUtterance(SENT[sent].t);u.lang='zh-CN';u.voice=voice;u.rate=.92;u.pitch=1;
 u.onstart=()=>{speechStarted=true;speechEvents.push({type:'start',sent,time:performance.now()});};

let audioCtx=null, ambientGain=null, ambientSuspendedForVisibility=false, pageHiddenAt=0;
function handlePageVisibility(){
  if(clock)clock.getDelta();
  invalidateRender();
  if(document.hidden){
    pageHiddenAt=performance.now();
    // Cancel native speech reliably; the same sentence restarts when the tour becomes visible.
    if(S.touring&&S.playing&&S.reading)stopSpeak();
    if(audioCtx&&audioCtx.state==='running'){
      ambientSuspendedForVisibility=true;
      audioCtx.suspend().catch(()=>{});
    }
  }else{
    if(pageHiddenAt&&S.manual&&Number.isFinite(S.manualUntil))S.manualUntil+=performance.now()-pageHiddenAt;
    pageHiddenAt=0;
    if(ambientSuspendedForVisibility&&audioCtx&&S.sound)audioCtx.resume().catch(()=>{});
    ambientSuspendedForVisibility=false;
  }
}
function initAudio(){
  if(audioCtx) return;
  try{
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    ambientGain = audioCtx.createGain(); ambientGain.gain.value=0;
    ambientGain.connect(audioCtx.destination);
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*2, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;
    const noise = audioCtx.createBufferSource(); noise.buffer=buf; noise.loop=true;
    const filter = audioCtx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=1200; filter.Q.value=.6;
    const g1 = audioCtx.createGain(); g1.gain.value=.12;ambientFilter=filter;ambientNoiseGain=g1;
    noise.connect(filter); filter.connect(g1); g1.connect(ambientGain); noise.start();
    const osc = audioCtx.createOscillator(); osc.type='sine'; osc.frequency.value=180;
    const g2 = audioCtx.createGain(); g2.gain.value=.03;
    osc.connect(g2); g2.connect(ambientGain); osc.start();ambientToneGain=g2;applyAmbientWeather();
  }catch(e){ audioCtx=null; }
}
function setAmbient(on){
  if(!audioCtx) initAudio();
  if(!audioCtx) return;
  ambientGain.gain.linearRampToValueAtTime(on?1:0, audioCtx.currentTime+.5);
  if(document.hidden){
    ambientSuspendedForVisibility=on;
    if(audioCtx.state==='running')audioCtx.suspend().catch(()=>{});
    return;
  }
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
}

function animate(){
 requestAnimationFrame(animate);
 if(document.hidden){clock.getDelta();skippedFrames++;return;}
 const dt=Math.min(clock.getDelta(),.08),a=ACTS[S.act];
 const tourAdvancing=S.touring&&S.playing,worldAnimating=!S.calm&&(!S.touring||S.playing);
 if(tourAdvancing){
  if(S.reading){
   speakCurrent();
   if(speechActive&&!speechStarted&&performance.now()-speechWaitSince>5500){
    speechEvents.push({type:'unavailable',sent:S.sent,reason:'native-voice-did-not-start'});stopSpeak();S.reading=false;$('btnRead').classList.remove('on');toast('设备朗读未能启动，继续无声游历');
   }
  }
  const duration=Math.max(3.5+SENT[S.sent].t.length*.16,({1:12,2:12,5:12,6:12,17:9,18:12,19:28,21:18})[S.sent]||0);
  S.actT=Math.min(1,S.actT+dt/duration);
  if(S.actT>=1&&(!S.reading||speechCompleted)){
   if(S.sent<a.e){gotoSent(S.sent+1,true);}
   else if(S.mode==='step'||S.act===ACTS.length-1){S.playing=false;S.atActEnd=true;updatePlayBtn();}
   else gotoSent(ACTS[S.act+1].s,true);
  }
  updateCharacters(dt,S.environmentTime);
  if(!S.manual){const shot=currentShot();CAM.pos.lerp(shot.pos,Math.min(1,dt*2.8));CAM.look.lerp(shot.look,Math.min(1,dt*2.8));}
 }
 updateCam(dt);
 if(worldAnimating){
  S.environmentTime+=dt;const t=S.environmentTime;updatePetals(t,dt,ENV.petalIntensity);if(weatherName==='rain')updateRainWeather(t);
  for(const v of P.villagers){const u=v.userData;
   if(u.pose==='hoe')u.armR.rotation.x=Math.sin(t*1.5+u.phase)*.5;
   else if(u.pose==='winnow')u.armL.rotation.z=.6+Math.sin(t*2.2+u.phase)*.3;
   else if(u.pose==='play')v.rotation.y+=dt*.4;
   else if(u.pose==='sit')u.head.rotation.y=Math.sin(t*.4+u.phase)*.3;
  }
  if(P.dog)P.dog.userData.tail.rotation.z=.5+Math.sin(t*6)*.4;
  if(P.chicken)P.chicken.rotation.y+=dt*.8;
 }
 $('tFill').style.width=((S.sent+S.actT)/SENT.length*100)+'%';$('timeline').setAttribute('aria-valuenow',String(S.sent));
 renderSceneIfNeeded(tourAdvancing||worldAnimating);
}

    let shadowCasterCount=0,shadowEligibleCount=0;scene.traverse(o=>{if(o.userData.taoyuanShadowCaster){shadowEligibleCount++;if(o.castShadow)shadowCasterCount++;}});
    return {
      ready:true,weather:weatherName,rainActive:!!rainSys?.visible,rainCount:rainSys?.visible?rainSys.geometry.drawRange.count/2:0,rippleCount:rippleSys?.visible?rippleSys.count:0,rainUpdates,rainSample:rainSys?Array.from(rainSys.geometry.attributes.position.array.slice(0,6)):[],groundColor:terrainMaterial?.color.getHex(),groundRoughness:terrainMaterial?.roughness,peachStats:{...PEACH_STATS},act:S.act, sent:S.sent, actName:ACTS[S.act].name,
      touring:S.touring,playing:S.playing, mode:S.mode, cap:S.cap,
      sentenceProgress:S.actT,atActEnd:S.atActEnd,speechActive,speechCompleted,spokenSentenceId,speechEvents:[...speechEvents],environmentTime:S.environmentTime,
      pixelRatio:renderer.getPixelRatio(),shadows:renderer.shadowMap.enabled,petalCount:petalSys.count,
      visibleCrowd:P.crowd.filter(v=>v.visible).length,visibleInvitees:P.invitees.filter(v=>v.visible).length,
      visibleSearchers:P.searchers.filter(v=>v.visible).length,feastVisible:feastTable.visible,liuZijiVisible:P.liuZiji.visible,
      reading:S.reading, sound:S.sound, calm:S.calm, quality:S.quality,
      cameraPos:{x:camera.position.x,y:camera.position.y,z:camera.position.z},
      fisherPos:{x:P.fisher.position.x,y:P.fisher.position.y,z:P.fisher.position.z},
      boatPos:{x:P.boat.position.x,y:P.boat.position.y,z:P.boat.position.z},
      visibleVillagers:P.villagers.filter(v=>v.visible).length,
      visibleMarks:P.marks.filter(m=>m.visible).length,
      renderedFrames,skippedFrames,pageHidden:document.hidden,shadowCasterCount,shadowEligibleCount,reflectionSize:poolReflection.getRenderTarget().width,
      renderCalls:renderer.info.render.calls,
      triangles:renderer.info.render.triangles,
    };
  }
};

/* ============================================================
   18. 启动
============================================================ */
async function init(){
  try{
    initThree();
  }catch(e){
    document.getElementById('loading').innerHTML='<p style="color:#a34a35">WebGL 不可用，请更换支持 WebGL 的浏览器。</p>';
    return;
  }
  const stages=[
   ['铺开山水',()=>{initLights();buildTerrain();buildWater();buildRoads();buildMountains();buildMountainDetails();}],
   ['桃林初绽',()=>{buildPeachForest();buildInnerFlora();}],
   ['田畴与人家',()=>{buildVillage();buildScenery();}],
   ['人间烟火',()=>{buildCharacters();buildPetals();buildMarks();buildGate();buildRainWeather();}],
  ];
  for(let i=0;i<stages.length;i++){
   $('loadLabel').textContent=stages[i][0]+' · '+(i+1)+' / '+stages.length;$('loadFill').style.width=(12+i*21)+'%';
   await new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,0)));
   stages[i][1]();
  }
  initVoice();
  bindUI();
  initEditorialUI();
  buildTOC();
  buildNotes();
  updateCaption();
  setQuality(S.quality);
  S.act=2;S.sent=7;applySentState(2,7);setCam(DEFAULT_VIEW.pos,DEFAULT_VIEW.look);syncUI();
  $('btnCalm').classList.toggle('on',S.calm);
  window.__taoyuan=taoyuanDiagnostics;
  $('loadFill').style.width='100%';$('loadLabel').textContent='桃源已至';
  setTimeout(()=>{ $('loading').classList.add('hide');setTimeout(()=>{$('loading').style.display='none';},550); },120);
  animate();
}
init().catch(e=>{console.error(e);document.getElementById('loading').innerHTML='<p>场景未能完成载入，请刷新页面重试。</p>';document.getElementById('loading').classList.remove('hide');});
</script>
</body>
